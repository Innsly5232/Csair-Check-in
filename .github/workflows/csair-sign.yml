name: 南航每日签到

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅检查 Cookie 格式（不提交签到）'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: csair-daily-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线回归测试
        run: python -m unittest discover -v
      - name: 仅检查配置（不联网、不推送）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        env:
          CSAIR_COOKIE_159: ${{ secrets.CSAIR_COOKIE_159 }}
          CSAIR_COOKIE_157: ${{ secrets.CSAIR_COOKIE_157 }}
          CSAIR_COOKIE_185: ${{ secrets.CSAIR_COOKIE_185 }}
          CSAIR_COOKIE_193: ${{ secrets.CSAIR_COOKIE_193 }}
        run: python csair_daily_sign.py --check
      - name: 提交签到并通知失败
        id: sign
        if: ${{ github.event_name == 'schedule' || !inputs.check_only }}
        env:
          CSAIR_COOKIE_159: ${{ secrets.CSAIR_COOKIE_159 }}
          CSAIR_COOKIE_157: ${{ secrets.CSAIR_COOKIE_157 }}
          CSAIR_COOKIE_185: ${{ secrets.CSAIR_COOKIE_185 }}
          CSAIR_COOKIE_193: ${{ secrets.CSAIR_COOKIE_193 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python csair_daily_sign.py
      - name: 签到前步骤失败提醒
        if: ${{ failure() && steps.sign.outcome == 'skipped' && (github.event_name == 'schedule' || !inputs.check_only) }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python - <<'PYTHON'
          from csair_daily_sign import notify_failures
          notify_failures(["签到未开始：依赖安装、Python 初始化或离线测试失败，请查看 Actions 步骤日志。"])
          PYTHON
      - name: 写入运行摘要
        if: always()
        env:
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = 'true' ]; then
            echo '本次为仅检查模式，不提交签到；检查结果请查看步骤日志。' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f sign_log.txt ]; then
            echo '### 签到结果' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat sign_log.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '未生成签到结果，请检查前面步骤的错误。' >> "$GITHUB_STEP_SUMMARY"
          fi
