name: 南航每日签到

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅检查 Cookie 格式（不提交签到）'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: csair-daily-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线回归测试
        run: python -m unittest -v test_csair.py
      - name: 检查配置
        env:
          CSAIR_COOKIES: ${{ secrets.CSAIR_COOKIES }}
        run: |
          if [ -z "$CSAIR_COOKIES" ]; then
            echo '::error::请在仓库 Actions Secrets 中设置 CSAIR_COOKIES。'
            exit 2
          fi
          python csair_daily_sign.py --check
      - name: 提交签到
        if: ${{ github.event_name == 'schedule' || !inputs.check_only }}
        env:
          CSAIR_COOKIES: ${{ secrets.CSAIR_COOKIES }}
        run: python csair_daily_sign.py
      - name: 写入运行摘要
        if: always()
        env:
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = 'true' ]; then
            echo '本次为仅检查模式，不提交签到；检查结果请查看步骤日志。' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f sign_log.txt ]; then
            echo '### 签到结果' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat sign_log.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '未生成签到结果，请检查前面步骤的错误。' >> "$GITHUB_STEP_SUMMARY"
          fi
